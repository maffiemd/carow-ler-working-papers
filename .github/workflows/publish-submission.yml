name: Publish Submission

on:
  repository_dispatch:
    types: [publish-submission]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # Checkout must authenticate with a real PAT, not the default
      # GITHUB_TOKEN - GitHub deliberately refuses to let a push made with
      # the default token trigger other on:push workflows (anti-loop
      # protection), which would otherwise silently prevent this commit
      # from ever rebuilding the site (pages.yml) or notifying the mailing
      # list (notify-subscribers.yml). Reuses the same PAT already set as
      # the Supabase Edge Function's GITHUB_PAT secret (Contents: Read and
      # write is sufficient for both), just also stored here as a GitHub
      # Actions secret.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.WORKFLOW_GITHUB_PAT }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install script dependencies
        working-directory: scripts
        run: npm install

      - name: Build front matter
        run: node scripts/publish-submission.js
        env:
          SLUG: ${{ github.event.client_payload.slug }}
          WP_NUMBER: ${{ github.event.client_payload.wp_number }}
          TITLE: ${{ github.event.client_payload.title }}
          AUTHORS_JSON: ${{ toJson(github.event.client_payload.authors) }}
          ABSTRACT: ${{ github.event.client_payload.abstract }}
          PDF_BOX_URL: ${{ github.event.client_payload.pdf_box_url }}

      # title/wp_number/slug ultimately trace back to a paper title an
      # anonymous author can set via the Box submission form, so they're
      # untrusted. ${{ }} is substituted as raw text before the shell
      # parses this script (GitHub's documented script-injection
      # footgun) - passing them through env: and referencing them as
      # shell variables instead means the shell only ever sees them as
      # data, never as script to parse.
      - name: Commit and push
        env:
          SLUG: ${{ github.event.client_payload.slug }}
          TITLE: ${{ github.event.client_payload.title }}
          WP_NUMBER: ${{ github.event.client_payload.wp_number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "_papers/$SLUG.md"
          git commit -m "Publish working paper: $TITLE ($WP_NUMBER)"
          git push

      - name: Notify author(s)
        run: node scripts/notify-author-accepted.js
        env:
          TITLE: ${{ github.event.client_payload.title }}
          WP_NUMBER: ${{ github.event.client_payload.wp_number }}
          SLUG: ${{ github.event.client_payload.slug }}
          AUTHORS_JSON: ${{ toJson(github.event.client_payload.authors) }}
          SERIES_PREFIX: ${{ vars.SERIES_PREFIX }}
          SITE_URL: ${{ vars.SITE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FROM_EMAIL: ${{ vars.FROM_EMAIL }}
          REPLY_TO: ${{ vars.REPLY_TO }}
          STAGING_EMAIL: ${{ vars.STAGING_EMAIL }}
          AUTHOR_MESSAGE: ${{ github.event.client_payload.author_message }}

      - name: Mark submission published in Supabase
        env:
          SUBMISSION_ID: ${{ github.event.client_payload.submission_id }}
        run: |
          curl -sf -X PATCH "${{ secrets.SUPABASE_URL }}/rest/v1/submissions?id=eq.$SUBMISSION_ID" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"status":"published"}'
