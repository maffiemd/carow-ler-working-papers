name: Build Cover Sheet

on:
  repository_dispatch:
    types: [build-cover-sheet]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install script dependencies
        working-directory: scripts
        run: npm install

      - name: Download manuscript
        run: curl -sL --fail "$MANUSCRIPT_URL" -o /tmp/manuscript.pdf
        env:
          MANUSCRIPT_URL: ${{ github.event.client_payload.manuscript_url }}

      - name: Build cover sheet and email it to the editor
        run: node scripts/send-cover-sheet.js
        env:
          SLUG: ${{ github.event.client_payload.slug }}
          WP_NUMBER: ${{ github.event.client_payload.wp_number }}
          TITLE: ${{ github.event.client_payload.title }}
          AUTHORS_JSON: ${{ toJson(github.event.client_payload.authors) }}
          MANUSCRIPT_PATH: /tmp/manuscript.pdf
          EDITOR_EMAIL: ${{ github.event.client_payload.editor_email }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FROM_EMAIL: ${{ vars.FROM_EMAIL }}
          STAGING_EMAIL: ${{ vars.STAGING_EMAIL }}
