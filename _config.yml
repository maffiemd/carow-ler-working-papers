title: CAROW Working Papers in Labor & Employment Relations
short_title: CAROW LER Working Papers
tagline: New research on industrial relations, employment relations, and workplace governance
description: >-
  A working paper series co-hosted by the Center for Applied Research on Work (CAROW) at the
  Cornell University ILR School and the Centre for Industrial Relations and Human Resources
  (CIRHR) at the University of Toronto, circulating new research on industrial relations,
  employment relations, labor-management institutions, collective bargaining, and workplace
  governance.
url: "https://maffiemd.github.io"
baseurl: "/carow-ler-working-papers"

series_prefix: "CAROW-LER-WP"

carow:
  name: Center for Applied Research on Work
  short_name: CAROW
  parent: Cornell University ILR School
  url: https://www.ilr.cornell.edu/carow

co_host:
  name: Centre for Industrial Relations and Human Resources
  short_name: CIRHR
  parent: University of Toronto
  url: https://www.cirhr.utoronto.ca/

editors:
  - name: "Kortney Koebel"
    affiliation: "University of Toronto"
  - name: "Michael Maffie"
    affiliation: "Cornell University, Johnson Graduate School of Management"

editorial_board:
  - name: "Rafael Gomez"
    affiliation: "University of Toronto"
  - name: "Sean O'Brady"
    affiliation: "McMaster University"
  - name: "Jenna Myers"
    affiliation: "University of Toronto"
  - name: "Shannon Potter"
    affiliation: "Université Laval"

contact_email: "TBD"

# Supabase project settings used by assets/js/supabase-client.js.
# The anon key is intentionally public: Row Level Security only lets it
# insert new subscribers and call the narrow unsubscribe() RPC (see
# supabase/schema.sql) — it can never read the subscriber list.
supabase_url: "https://gfiqcuznnmzpvnpynbxj.supabase.co"
supabase_anon_key: "sb_publishable_ojxVoMg5XUzGjCCo1cOPjw_vVnsOlcr"

collections:
  papers:
    output: true
    permalink: /papers/:path/
    sort_by: wp_number

defaults:
  - scope:
      path: ""
      type: papers
    values:
      layout: paper
      status: working

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

sass:
  sass_dir: _sass

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - templates
  - vendor
  - node_modules
  - scripts
  - supabase
