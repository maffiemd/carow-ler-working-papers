title: CAROW Working Papers in Labor & Employment Relations
short_title: CAROW LER Working Papers
tagline: New research on industrial relations, employment relations, and workplace governance
description: >-
  A working paper series affiliated with the Center for Applied Research on Work (CAROW)
  at the Cornell University ILR School, circulating new research on industrial relations,
  employment relations, labor-management institutions, collective bargaining, and workplace
  governance.
url: "" # e.g. https://carow-ler.github.io — fill in once the repo is published
baseurl: ""

series_prefix: "CAROW-LER-WP"

carow:
  name: Center for Applied Research on Work
  short_name: CAROW
  parent: Cornell University ILR School
  url: https://www.ilr.cornell.edu/carow

editor:
  name: "TBD"
  email: "TBD"

collections:
  papers:
    output: true
    permalink: /papers/:path/
    sort_by: wp_number

defaults:
  - scope:
      path: ""
      type: papers
    values:
      layout: paper
      status: working

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

sass:
  sass_dir: _sass

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - templates
  - vendor
  - node_modules
