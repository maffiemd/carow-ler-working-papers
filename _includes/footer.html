<footer class="site-footer">
  <div class="site-footer__inner">
    <img class="site-footer__logo" src="{{ '/assets/images/cornell-reduced-white.svg' | relative_url }}" alt="Cornell University">
    <div class="site-footer__text">
      <p>
        {{ site.short_title }} is an applied-research output of the
        <a href="{{ site.carow.url }}">{{ site.carow.name }} (CAROW)</a>
        at the {{ site.carow.parent }}.
      </p>
      <p>
        <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
        &middot;
        <a href="mailto:{{ site.editor.email }}">Contact the editor</a>
      </p>
    </div>
  </div>
</footer>
