<meta name="citation_title" content="{{ page.title }}">
{% for author in page.authors %}
<meta name="citation_author" content="{{ author.name }}">
{% if author.affiliation %}<meta name="citation_author_institution" content="{{ author.affiliation }}">{% endif %}
{% endfor %}
<meta name="citation_publication_date" content="{{ page.date | date: '%Y/%m/%d' }}">
<meta name="citation_technical_report_institution" content="{{ site.carow.name }}, {{ site.carow.parent }}">
<meta name="citation_technical_report_number" content="{{ page.wp_number }}">
{% if page.pdf_path %}<meta name="citation_pdf_url" content="{{ page.pdf_path | absolute_url }}">{% endif %}
{% if page.doi %}<meta name="citation_doi" content="{{ page.doi }}">{% endif %}
{% for kw in page.keywords %}<meta name="citation_keywords" content="{{ kw }}">{% endfor %}
{% if page.abstract %}<meta name="description" content="{{ page.abstract | strip_html | truncate: 300 }}">{% endif %}
